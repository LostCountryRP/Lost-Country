<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro Medico — Lost Country RP</title><link rel="stylesheet" href="style.css?v=20261024-evoluzione-completa"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script defer src="medico.js?v=1"></script></head><body class="page-sceriffi"><div class="site-shell"><aside class="western-sidebar"><a class="sidebar-brand" href="index.html"><img src="logo.png" alt="Lost Country RP"><span>Lost Country RP</span></a><nav class="side-nav"><a href="index.html">Regolamento</a><a href="sceriffi.html">Sceriffi</a><a href="medico.html">Registro medico</a></nav></aside><main class="site-main"><section class="parchment-page"><div class="parchment-content"><h1 class="app-title">✚ Registro Medico</h1><p>Archivio riservato al personale sanitario di Lost Country. Solo documentazione immaginaria RP.</p><div id="medicAuth" class="app-card"><h2>Accesso personale medico</h2><form id="medicLogin" class="form-grid"><div><label>Email</label><input id="medicEmail" type="email" required autocomplete="username"></div><div><label>Password</label><input id="medicPassword" type="password" required autocomplete="current-password"></div><div class="full"><button class="btn-primary" type="submit">Accedi</button></div></form></div><section id="medicPanel" hidden><div class="app-card"><p>Medico: <strong id="medicUser"></strong> <button id="medicLogout" class="btn-secondary" type="button">Esci</button></p><h2>Nuovo referto RP</h2><form id="medicForm" class="form-grid"><div><label>Paziente</label><input id="medicPatient" minlength="3" maxlength="150" required></div><div><label>Motivo visita</label><input id="medicReason" minlength="5" maxlength="300" required></div><div class="full"><label>Referto</label><textarea id="medicFindings" minlength="5" maxlength="4000" required></textarea></div><div class="full"><label>Trattamento</label><textarea id="medicTreatment" maxlength="4000"></textarea></div><div class="full"><label>Note riservate</label><textarea id="medicNotes" maxlength="3000"></textarea></div><div class="full"><button id="medicSave" class="btn-primary" type="submit">Registra referto</button></div></form><hr><label>Cerca paziente</label><input id="medicSearch" type="search" placeholder="Nome personaggio"><button id="medicRefresh" class="btn-secondary" type="button">Aggiorna</button><div id="medicList"></div></div></section><p id="medicNotice" role="status"></p></div></section></main></div></body></html>
