name: Verifica struttura Lost Country
on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'tests/**'
      - 'scripts/**'
      - 'supabase/functions/**'
      - '.github/workflows/site-structure.yml'
  push:
    branches:
      - main
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'tests/**'
      - 'scripts/**'
      - 'supabase/functions/**'
      - '.github/workflows/site-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-links:
    name: Pagine, link, CMS e moduli
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlla la sintassi degli script della navigazione e del CMS
        run: |
          node --check lc-unified-navbar.js
          node --check lc-cms-public.js
          node --check amministrazione-contenuti.js
          node --check western-premium.js
          node --check site-enhancements.js
      - name: Verifica la struttura del sito
        run: node --test tests/*.test.mjs
      - name: Verifica backup Storage
        run: python3 tests/backup-storage.test.py
