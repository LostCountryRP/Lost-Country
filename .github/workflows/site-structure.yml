name: Verifica struttura Lost Country
on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'tests/site-structure.test.mjs'
      - '.github/workflows/site-structure.yml'
  push:
    branches:
      - struttura-sito-2026-10-25
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.css'
      - 'tests/site-structure.test.mjs'
      - '.github/workflows/site-structure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-links:
    name: Pagine, link, CMS e moduli
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica la struttura del sito
        run: node --test tests/site-structure.test.mjs
