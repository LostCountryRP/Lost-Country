name: Lost Country - Backup database cifrato
on:
  schedule:
    - cron: '40 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database-backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Controlla prerequisiti
        id: prereq
        shell: bash
        run: |
          if [[ -z "$SUPABASE_DB_URL" || -z "$BACKUP_AGE_RECIPIENT" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backup non configurato: imposta SUPABASE_DB_URL (secret) e BACKUP_AGE_RECIPIENT (variable)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Installa Supabase CLI
        if: steps.prereq.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Installa age
        if: steps.prereq.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
      - name: Esporta, cifra e rimuovi copie in chiaro
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p temp_backup backup_output
          trap 'rm -rf temp_backup' EXIT
          supabase db dump --db-url "$SUPABASE_DB_URL" -f temp_backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f temp_backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f temp_backup/data.sql --data-only --use-copy
          tar -C temp_backup -cf - roles.sql schema.sql data.sql | age -r "$BACKUP_AGE_RECIPIENT" -o "backup_output/lost-country-$(date -u +%Y-%m-%d).tar.age"
          test -s backup_output/*.age
      - name: Archivia il backup cifrato
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lost-country-db-encrypted-${{ github.run_number }}
          path: backup_output/*.age
          if-no-files-found: error
          retention-days: 30
